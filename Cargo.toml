[workspace]
members = ["kernel", "xtask"]
# Bare `cargo build/clippy/test` means the host-side image builder and
# runner only. The kernel is a member so it can be linted for its real
# target, which must be requested explicitly:
#   cargo clippy --package kernel --target x86_64-unknown-none
# Running these for the host fails on asm! registers and the
# x86_64-gated `bootloader_api::entry_point` macro.
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[package]
name = "grey-os"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
default-run = "qemu-uefi"

[lints]
workspace = true

[dependencies]
anyhow = "1"
ovmf-prebuilt = "0.2"

[build-dependencies]
anyhow = "1"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "0.11"

[profile.release]
lto = true
codegen-units = 1
# A kernel cannot unwind, and an unwind through `extern "x86-interrupt"` is undefined
# behaviour anyway: abort is the only honest panic strategy here, and it is also what makes
# the panic handler's `-> !` true of the code the compiler generates.
panic = "abort"
# On by default in debug and off in release, which means the fast build is the one that
# silently wraps. An OS that hands out frames and sizes has to be the one that fails loudly,
# so the check stays on in both profiles and the boot test exercises it.
overflow-checks = true
